name: Deploy Staging to S3

on:
  workflow_run:
    workflows: [Frontend CI] 
    types:
      - completed
    branches:
      - 'main'
      - 'staging-cd'

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Create env file
        run: |
          echo "VITE_API_BASE_URL=${{ secrets.BACKEND_API_URL }}" > .env
          echo "VITE_GEOAPIFY_KEY=${{ secrets.GEOAPIFY_KEY }}" >> .env
          echo "VITE_FRONTEND_BASE_URL=${{ secrets.VITE_FRONTEND_BASE_URL }}" >> .env
        shell: bash

      - name: Build project
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Deploy to S3
        run: |
          aws s3 sync \
            ./dist \
            s3://collabios-bucket-frontend \
            --delete 
            
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_ID }} \
            --paths "/*"